# Workflow to build and publish the Docker image to Docker Hub
name: Build and Publish Docker Image

on:
  # Trigger when a release is published
  release:
    types: [published]
  # Trigger manually via the Actions tab with a required tag input
  workflow_dispatch:
    inputs:
      tag:
        description: "The git tag to build (e.g., v0.1.1)"
        required: true
        type: string

env:
  # Docker image name to publish
  IMAGE_NAME: memmachine/memmachine

permissions:
  # Only need read access to repository contents for this workflow
  contents: read

# Prevents overlapping runs for the same ref; cancels in-progress jobs if a new one starts
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push Image
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      # Step 0: Free Disk Space (Manual)
      - name: Free Disk Space (Manual)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

      # Step 1: Checkout source for Release triggers
      - name: Checkout source (Release)
        if: github.event_name == 'release'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Step 1: Checkout source for Manual triggers
      - name: Checkout source (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # Step 2: Enable QEMU for multi-platform builds (required for ARM support)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx (needed for advanced Docker builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_API_KEY }}

      # Step 4.5: Get SCM Version
      - name: Get SCM Version
        id: scm
        run: echo "version=$(git describe --tags --always | sed 's/^v//;s/-\([0-9]\+\)-g\([0-9a-f]\+\)/.dev\1+g\2/')" >> $GITHUB_OUTPUT

      # Step 5: Extract Docker metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            # The latest rules below add the latest tag
            latest=false
          # For a pre-release version, a semver rule replaces its pattern with
          # {{version}} but keeps its prefix. The v therefore goes in the
          # prefix, and the latest rules skip any version with a pre-release
          # part, since they would tag the bare version.
          tags: |
            # For Manual (workflow_dispatch) runs
            type=semver,pattern={{version}},prefix=v,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern=latest,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-') }}

            # For Release events
            type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'release' }}
            type=semver,pattern=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # Step 5.5: Prune Docker system
      - name: Prune Docker system
        run: docker system prune -af

      # Step 6: Build and push the image
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SCM_VERSION=${{ steps.scm.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 7: Show the digest of the built image (useful for traceability)
      - name: Show image digest
        run: echo "Digest - ${{ steps.build.outputs.digest }}"
