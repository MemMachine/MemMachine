# Reusable GitHub Actions workflow for building Python packages

name: Build python package

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full Git history for SCM versioning

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies and uv
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build
          pip install uv

      - name: Build the packages with uv
        run: |
          uv build --project packages/common && uv build --project packages/client && uv build --project packages/server

          # The meta-package requires exactly the client and server built with it.
          version=$(basename dist/memmachine_client-*.whl | cut -d- -f2)
          sed -i "s/\"memmachine-client\"/\"memmachine-client==${version}\"/; s/\"memmachine-server\"/\"memmachine-server==${version}\"/" packages/meta/pyproject.toml
          grep -q "\"memmachine-client==${version}\"" packages/meta/pyproject.toml && grep -q "\"memmachine-server==${version}\"" packages/meta/pyproject.toml || { echo "::error::Could not pin the meta-package's dependencies to ${version}"; exit 1; }

          # packages/meta is not a workspace member, so name the output directory.
          uv build --project packages/meta --out-dir dist
          ls -lh dist/

      - name: Check that every package was built
        run: |
          for package in memmachine_common memmachine_client memmachine_server memmachine; do
            ls dist/${package}-*.whl dist/${package}-*.tar.gz > /dev/null || { echo "::error::dist/ is missing ${package}"; exit 1; }
          done

      - name: Upload built distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/*
