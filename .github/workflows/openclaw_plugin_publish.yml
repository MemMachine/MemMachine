# GitHub Actions workflow to publish Openclaw plugin package to npm on release

name: Publish OpenClaw plugin Package to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./integrations/openclaw/
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Check the release tag
        id: release
        uses: ./.github/actions/release-version
        with:
          tag: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Wait for @memmachine/client
        # The plugin depends on the client at the same version, which the client's
        # publish workflow uploads during the same release.
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in $(seq 60); do
            if [ "$(npm view "@memmachine/client@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::@memmachine/client ${VERSION} is not on npm after 10 minutes."
          exit 1

      - name: Apply version to package and dependency
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          PKG_VERSION="${VERSION}" MM_CLIENT_VERSION="${VERSION}" node -e '
            const fs = require("node:fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.PKG_VERSION;
            pkg.dependencies = pkg.dependencies || {};
            pkg.dependencies["@memmachine/client"] = process.env.MM_CLIENT_VERSION;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to npm
        # A pre-release goes to the next dist-tag; npm refuses to publish one as latest.
        run: npm publish --access public --provenance --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  report-failure:
    needs: publish
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/release-failure.yml
    with:
      step: Publishing @memmachine/openclaw-memmachine to npm
      tag: ${{ inputs.tag || github.event.release.tag_name }}
