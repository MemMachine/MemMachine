# GitHub Actions workflow to build and test TypeScript client package

name: Build and Test TypeScript Client Package

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ts-client/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ts-client/**'
    # ready_for_review is not a default type; it runs the checks a draft skipped.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  build:
    # A draft pull request skips CI until it is marked ready for review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/ts-client
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test
