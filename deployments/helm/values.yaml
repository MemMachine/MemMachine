# Default configuration values for the MemMachine Helm chart.
# Override any value with --set <key>=<value> or -f <override-file>.
#
# SECURITY: Default passwords below (neo4j.password, postgres.password) are for
# development/demo only. For production, override them via --set/-f or provide
# secrets out-of-band (e.g., Vault, sealed-secrets); see README.
#
# Sections:
#   storageClass / accessMode / pvcSize     - shared PVC settings for all three volumes
#   neo4j.*                    - Neo4j image, auth, JVM heap, and connection pool
#   postgres.*                 - PostgreSQL image, credentials, and pool settings
#   qdrant.*                   - Qdrant image and connection settings (event backend vector store)
#   memmachine.*               - App image, LLM/embedder backend, and app config
#   nodePorts.*                - NodePort assignments for external access

storageClass: nfs-client
accessMode: ReadWriteMany
pvcSize: 5Gi

# Long-term memory backend. This picks which vector store is deployed and wired:
#   event       -> Qdrant (vector_store) + Postgres (segment_store). The default.
#   declarative -> Neo4j (vector_graph_store). The legacy backend.
# The two are mutually exclusive in the server config, so only the store the
# chosen backend needs is deployed; the other is skipped even if its
# `enabled` flag is true. Any other value fails the install.
episodicMemory:
  longTermMemory:
    backend: event           # event | declarative

neo4j:
  enabled: true              # false = skip in-cluster Deployment/Service/PVC, use external host
  host: memmachine-neo4j     # internal service name (default); override when enabled: false
  port: 7687                 # default Bolt port; override if external uses different port
  image: neo4j:5.23-community
  user: neo4j
  password: memverge   # dev default; override in production
  plugins: ["apoc", "graph-data-science"]
  heap:
    initial: 512m
    max: 1G
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  pool:
    max_connection_pool_size: 100
    connection_acquisition_timeout: 60.0
    range_index_creation_threshold: 10000
    vector_index_creation_threshold: 10000
    max_connection_lifetime: 3600        # driver default (1 hour); lower for AuraDB (e.g. 3000)
    # liveness_check_timeout: ~          # driver default (disabled); set to 0 to always check

postgres:
  enabled: true              # false = skip in-cluster Deployment/Service/PVC, use external host
  host: memmachine-postgres  # internal service name (default); override when enabled: false
  port: 5432                 # default Postgres port; override if external uses different port
  image: pgvector/pgvector:pg18
  user: memmachine
  password: memverge   # dev default; override in production
  database: memmachine
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30      # SQLAlchemy default (seconds to wait for a connection)
  pool_recycle: -1      # SQLAlchemy default (disabled; set to e.g. 3000 for idle-timeout avoidance)
  pool_pre_ping: false  # SQLAlchemy default; set to true to test connections before checkout
  command_timeout: 60   # asyncpg only: seconds a statement may run before it is cancelled; null for unbounded
  connect_timeout: 10   # asyncpg only: seconds to wait for a new connection; null to wait indefinitely
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

qdrant:
  enabled: true              # false = skip in-cluster Deployment/Service/PVC, use external host
  host: memmachine-qdrant    # internal service name (default); override when enabled: false
  port: 6333                 # REST port
  grpcPort: 6334             # gRPC port
  image: qdrant/qdrant:v1.19.1
  prefer_grpc: false         # true = talk gRPC (grpcPort) instead of REST
  https: false               # true when fronted by TLS, or for Qdrant Cloud
  # API key, required for Qdrant Cloud. Never written to the ConfigMap: it is
  # stored in a Secret and passed to MemMachine as $QDRANT_API_KEY (and, for the
  # in-cluster instance, enforced on Qdrant itself). Prefer existingSecret —
  # a Secret you create out-of-band with a QDRANT_API_KEY key — over apiKey,
  # which the chart turns into qdrant-secret but which still passes through
  # values. existingSecret wins if both are set. Leave both empty for no auth.
  apiKey: ""
  existingSecret: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

memmachine:
  image: docker.io/memmachine/memmachine
  tag: latest-cpu
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  openaiApiKey: <OPENAI_API_KEY>
  config:
    loggingLevel: INFO
    memoryConfigPath: /app/configuration.yml
    baseUrl: http://127.0.0.1:8080
    gatewayUrl: http://localhost:8080
  model:
    provider: openai-responses
    base_url: https://api.openai.com/v1
    model_path: gpt-5-mini
  embedder:
    provider: openai
    base_url: https://api.openai.com/v1
    model_path: text-embedding-3-small
    dimensions: 1536

nodePorts:
  http8080: 31001
