{{- if .Values.qdrant.enabled }}
# qdrant-service.yaml
# ClusterIP Service for internal access to Qdrant.
# Exposes two ports:
#   - 6333 (REST — used by MemMachine by default)
#   - 6334 (gRPC — used when qdrant.prefer_grpc is true)
# DNS inside the cluster: memmachine-qdrant.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: memmachine-qdrant
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: qdrant
  ports:
    - name: rest
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
{{- end }}
