# memmachine-deployment.yaml
# Deploys the MemMachine application server (1 replica).
# Init containers block startup until PostgreSQL and the long-term memory
# store accept connections, then run `memmachine-server migrate`. The main
# container mounts:
#   - memmachine-config ConfigMap → /app/configuration.yml  (app config)
#   - memmachine-env-config ConfigMap → /app/.env           (env vars)
#   - memmachine-pvc PVC → /app/data                        (persistent logs/data)
# OPENAI_API_KEY is injected from the memmachine-secrets Secret, and
# QDRANT_API_KEY from qdrant-secret (or qdrant.existingSecret) when set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memmachine
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # The migrate init container runs while no server does: Recreate stops
  # the old pod before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memmachine
  template:
    metadata:
      labels:
        app: memmachine
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zv {{ .Values.postgres.host }} {{ .Values.postgres.port }}; do echo waiting for postgres; sleep 2; done']

{{- if (eq (include "memmachine.ltmBackend" .) "declarative") }}
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zv {{ .Values.neo4j.host }} {{ .Values.neo4j.port }}; do echo waiting for neo4j; sleep 2; done']
{{- end }}

{{- if (eq (include "memmachine.ltmBackend" .) "event") }}
        - name: wait-for-qdrant
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -zv {{ .Values.qdrant.host }} {{ .Values.qdrant.port }}; do echo waiting for qdrant; sleep 2; done']
{{- end }}

        # Creates or updates every configured store's schema before the
        # server starts.
        - name: migrate
          image: {{ .Values.memmachine.image }}:{{ .Values.memmachine.tag }}
          imagePullPolicy: {{ .Values.memmachine.pullPolicy }}
          command: ["memmachine-server", "migrate"]
          env:
            {{- include "memmachine.appEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "memmachine.appVolumeMounts" . | nindent 12 }}

      containers:
        - name: memmachine
          image: {{ .Values.memmachine.image }}:{{ .Values.memmachine.tag }}
          imagePullPolicy: {{ .Values.memmachine.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.memmachine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            {{- include "memmachine.appEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "memmachine.appVolumeMounts" . | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: memmachine-config
        - name: env-volume
          configMap:
            name: memmachine-env-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: memmachine-pvc
