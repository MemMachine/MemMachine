# A generic, single database configuration.

[alembic]
script_location = %(here)s/packages/server/src/memmachine_server/semantic_memory/storage/alembic_pg

prepend_sys_path = .
path_separator = os


# One section per store lineage. To add a revision, upgrade a scratch
# database and generate against it:
#   alembic -n <lineage> -x url=<database URL> upgrade head
#   alembic -n <lineage> -x url=<database URL> revision --autogenerate -m "<message>"

[session]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/session_manager/migrations
path_separator = os
lineage = memmachine_server.common.session_manager.session_data_manager_sql_impl:SESSION_LINEAGE

[episode_store]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/episode_store/migrations
path_separator = os
lineage = memmachine_server.common.episode_store.episode_sqlalchemy_store:EPISODE_STORE_LINEAGE

[lease_lock]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/sql_lease_lock/migrations
path_separator = os
lineage = memmachine_server.common.sql_lease_lock._store:LEASE_LOCK_LINEAGE

[segment_store]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/episodic_memory/event_memory/segment_store/migrations
path_separator = os
lineage = memmachine_server.episodic_memory.event_memory.segment_store.sqlalchemy_segment_store:SEGMENT_STORE_LINEAGE

[partition_registry]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/vector_store/partition_registry/migrations
path_separator = os
lineage = memmachine_server.common.vector_store.partition_registry.sqlalchemy_partition_registry:PARTITION_REGISTRY_LINEAGE

[sqlite_vector_store]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/vector_store/migrations/sqlite_vector_store
path_separator = os
lineage = memmachine_server.common.vector_store.sqlite_vector_store:SQLITE_VECTOR_STORE_LINEAGE

[sqlite_vec_vector_store]
script_location = %(here)s/packages/server/src/memmachine_server/common/schema_migration/environment
version_locations = %(here)s/packages/server/src/memmachine_server/common/vector_store/migrations/sqlite_vec_vector_store
path_separator = os
lineage = memmachine_server.common.vector_store.sqlite_vec_vector_store:SQLITE_VEC_VECTOR_STORE_LINEAGE


[post_write_hooks]

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
